name: Deploy Modal room QA worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ynot-room-poc
    paths:
      - "workers/ynot_room_qa_modal.py"
      - ".github/workflows/deploy-modal-room-qa.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal>=1.2,<2" "fastapi[standard]" requests
      - name: Deploy YNOT Room QA worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy workers/ynot_room_qa_modal.py --name ynot-room-qa
      - name: Let Modal route traffic to the new deployment
        run: sleep 15
      - name: Verify matched-camera QA on reconstructed room
        env:
          QA_URL: https://tonykone555--ynot-room-qa-room-qa.modal.run
          TEST_ROOM_ID: b8eb5d66-47df-43de-bfe9-9e9c93ae4bb8
        run: |
          python - <<'PY'
          import os, requests
          response=requests.get(
              os.environ["QA_URL"],
              params={"id":os.environ["TEST_ROOM_ID"],"refresh":"true"},
              timeout=180,
          )
          print("qa",response.status_code,response.text[:6000])
          response.raise_for_status()
          data=response.json()
          if data.get("status") != "complete":
              raise SystemExit(f"QA did not complete: {data}")
          if data.get("matchedCameraCount",0) < 3:
              raise SystemExit(f"Expected 3 matched cameras: {data}")
          if len(data.get("viewReports") or []) < 3:
              raise SystemExit(f"Expected per-view QA reports: {data}")
          if "averageScore" not in data or "releaseStatus" not in data or "canPublish" not in data:
              raise SystemExit(f"Missing aggregate QA fields: {data}")
          print("YNOT Room matched-camera QA smoke test passed", {
              "matchedCameraCount":data.get("matchedCameraCount"),
              "referenceCoverage":data.get("referenceCoverage"),
              "averageScore":data.get("averageScore"),
              "blockers":len(data.get("blockers") or []),
              "releaseStatus":data.get("releaseStatus"),
          })
          PY
