name: Patch Room catalogue recall
on:
  push:
    branches: [fix/room-electronics-catalog-recall]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-electronics-catalog-recall
      - name: Make catalogue filtering recall-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/catalog/route.ts')
          s=p.read_text()
          s=s.replace('if(/headphone|speaker|charger|keyboard|mouse|phone|tech|camera|smart/.test(q))return"tech";', 'if(/headphone|earbud|speaker|charger|power bank|keyboard|mouse|phone|smartphone|iphone|android|tech|technology|electronic|camera|smart|macbook|laptop|notebook|computer|desktop|\\bpc\\b|monitor|display|screen|imac|ipad|tablet|television|\\btv\\b|projector|printer|console|playstation|xbox|nintendo|smartwatch|watch|ssd|storage|router|network|\\bgpu\\b|graphics card|\\bcpu\\b|processor|motherboard/.test(q))return"tech";')
          old='''function strictCategoryFilter(query:string,products:Product[]){\n const domain=inferSearchDomain(query);\n const filtered=products.filter(p=>categoryCompatible(domain,p));\n // Keep recall if merchant metadata is sparse, but never let unrelated products dominate.\n return filtered.length>=Math.min(8,Math.max(3,Math.floor(products.length*.2)))?filtered:products.filter(p=>categoryCompatible(domain,p));\n}'''
          new='''function strictCategoryFilter(query:string,products:Product[]){\n const domain=inferSearchDomain(query);\n const filtered=products.filter(p=>categoryCompatible(domain,p));\n // Shopify already searched the user's exact intent. Category classification is a\n // ranking aid, not an allow-list: never erase valid catalogue results just because\n // YNOT has not learned that product family yet. Put compatible items first while\n // retaining the remaining exact Shopify matches as recall-safe fallbacks.\n const compatibleIds=new Set(filtered.map(p=>p.id));\n return [...filtered,...products.filter(p=>!compatibleIds.has(p.id))];\n}'''
          if old not in s: raise SystemExit('strictCategoryFilter block not found')
          s=s.replace(old,new)
          s=s.replace('nouns:["headphones","speaker","charger","power bank","keyboard","mouse","phone case","stand","camera accessory","smart light"]', 'nouns:["laptop","computer","monitor","tablet","television","smartphone","headphones","speaker","charger","power bank","keyboard","mouse","printer","projector","gaming console","smartwatch","camera","router","storage","phone case","stand","smart light"]')
          s=s.replace('tech:/\\b(headphone|earbud|speaker|charger|power bank|keyboard|mouse|phone case|usb-c|bluetooth|camera|smart light|tech|wireless|electronic)\\b/i', 'tech:/\\b(macbook|laptop|notebook|computer|desktop|pc|monitor|display|screen|imac|ipad|tablet|television|tv|smartphone|iphone|android|headphone|earbud|speaker|charger|power bank|keyboard|mouse|phone case|usb-c|bluetooth|camera|printer|projector|console|playstation|xbox|nintendo|smartwatch|watch|ssd|storage|router|network|gpu|graphics card|cpu|processor|motherboard|smart light|tech|technology|wireless|electronic|electronics)\\b/i')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/catalog/route.ts
          git diff --cached --quiet || git commit -m "Fix Room catalogue recall for identified products"
          git push
