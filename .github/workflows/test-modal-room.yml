name: Test Modal room worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ynot-room-poc
    paths:
      - "app/api/room/jobs/route.ts"
      - "workers/ynot_room_modal.py"
      - ".github/workflows/test-modal-room.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Submit synthetic room and verify GPU preflight
        env:
          SUBMIT_URL: https://tonykone555--ynot-room-submit-room.modal.run
          STATUS_URL: https://tonykone555--ynot-room-room-status.modal.run
        run: |
          python - <<'PY'
          import io, os, time
          import requests
          from PIL import Image, ImageDraw

          files=[]
          for i in range(3):
              image=Image.new("RGB", (640, 480), (225-i*12, 220-i*6, 210+i*8))
              draw=ImageDraw.Draw(image)
              draw.rectangle((70+i*20, 170, 570-i*20, 400), outline=(60,60,60), width=8)
              draw.line((320, 40, 320+i*35, 430), fill=(90,90,90), width=5)
              buffer=io.BytesIO()
              image.save(buffer, format="JPEG", quality=88)
              buffer.seek(0)
              files.append(("photos", (f"view-{i+1}.jpg", buffer.getvalue(), "image/jpeg")))

          response=requests.post(
              os.environ["SUBMIT_URL"],
              files=files,
              data={"style":"modern","roomType":"living_room","budget":"2500","source":"github-smoke"},
              timeout=45,
          )
          print("submit", response.status_code, response.text)
          response.raise_for_status()
          job=response.json()
          job_id=job["id"]

          terminal=None
          for attempt in range(30):
              time.sleep(3)
              status=requests.get(os.environ["STATUS_URL"], params={"id":job_id}, timeout=20)
              print("status", attempt+1, status.status_code, status.text)
              status.raise_for_status()
              payload=status.json()
              if payload.get("status") in {"ready_for_reconstruction","failed"}:
                  terminal=payload
                  break

          if terminal is None:
              raise SystemExit("Room worker did not reach a terminal preflight state")
          if terminal.get("status") != "ready_for_reconstruction":
              raise SystemExit(f"Room worker failed: {terminal}")
          if terminal.get("photoCount") != 3:
              raise SystemExit(f"Unexpected photo count: {terminal}")
          print("YNOT Room Modal GPU smoke test passed", terminal)
          PY
