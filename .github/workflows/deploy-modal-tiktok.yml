name: Deploy Modal TikTok Search

on:
  push:
    branches: [main]
    paths:
      - "scripts/modal_tiktok_search.py"
      - ".github/workflows/deploy-modal-tiktok.yml"
  workflow_dispatch:

concurrency:
  group: modal-tiktok-search
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out YNOT
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade modal
      - name: Deploy TikTok search worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing GitHub secret MODAL_TOKEN_ID"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing GitHub secret MODAL_TOKEN_SECRET"; exit 1; }
          modal deploy scripts/modal_tiktok_search.py
