name: Deploy Modal image worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modal/ynot_image_worker.py"
      - ".github/workflows/deploy-modal-image.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal>=1.2,<2"
      - name: Deploy YNOT image worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal/ynot_image_worker.py --name ynot-image-worker
