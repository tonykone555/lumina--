name: Apply semantic catalogue fallback

on:
  push:
    paths:
      - '.github/workflows/semantic-catalog-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch catalogue search expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/catalog/route.ts')
          s=p.read_text()
          old='if(/sofa|chair|furniture|lamp|rug|decor|table|home|bed|desk|mirror/.test(q))return"home";'
          new='if(/sofa|chair|furniture|lamp|rug|decor|table|home|bed|desk|mirror|kitchen|island|urn|vase|planter|pot|cabinet|sideboard|shelf|shelving|console|bench|stool|ottoman|couch|sectional|loveseat|wardrobe|dresser|nightstand|chandelier|lighting|sculpture|statue|bowl|tray/.test(q))return"home";'
          if old not in s: raise SystemExit('home domain marker not found')
          s=s.replace(old,new,1)
          start=s.index('function expandCatalogQueries(query:string){')
          end=s.index('\nfunction enrichedTags(', start)
          replacement=r'''function expandCatalogQueries(query:string){
 const clean=(stripPriceLanguage(query)||query).replace(/\s+/g," ").trim();
 const domain=inferSearchDomain(clean);
 const set=SEARCH_ATTRIBUTE_SETS[domain];
 const lower=clean.toLowerCase();
 const words=significantWords(clean);
 const queries:string[]=[clean];
 if(words.length>1){
  for(let i=1;i<words.length;i++)queries.push(words.slice(i).join(" "));
  const maxN=Math.min(4,words.length);
  for(let n=maxN;n>=1;n--){for(let i=0;i+n<=words.length;i++)queries.push(words.slice(i,i+n).join(" "))}
 }
 const aliases:Record<string,string[]>={
  urn:["floor vase","decorative urn","large vase"],vase:["floor vase","decorative vase","urn"],
  island:["kitchen island","island table","kitchen work table"],sofa:["couch","sectional","loveseat"],
  couch:["sofa","sectional","loveseat"],sectional:["sectional sofa","modular sofa","couch"],
  cabinet:["storage cabinet","sideboard","console cabinet"],sideboard:["cabinet","credenza","console"],
  planter:["plant pot","floor planter","decorative planter"],lamp:["light","lighting","table lamp"],
  chandelier:["pendant light","ceiling light","chandelier"],rug:["area rug","carpet"],
  sneakers:["trainers","shoes"],trainers:["sneakers","shoes"],tee:["t-shirt","shirt"],
  headphones:["headset","wireless headphones"],earbuds:["earphones","wireless earbuds"]
 };
 for(const word of words){for(const alias of aliases[word]||[])queries.push(alias)}
 const foundNoun=[...set.nouns].sort((a,b)=>b.length-a.length).find(n=>lower.includes(n.toLowerCase()));
 const broadTerms:Record<string,RegExp>={
  fashion:/^(?:men'?s?|women'?s?|unisex)?\s*(?:clothes|clothing|fashion|apparel|menswear|womenswear|outfits?)$/i,
  fitness:/^(?:fitness|gym|workout|training|activewear|sportswear|gym clothes|fitness clothes)$/i,
  nutrition:/^(?:supplements?|sports nutrition|nutrition|protein|workout supplements?)$/i,
  home:/^(?:home|furniture|home decor|decor)$/i,
  skin:/^(?:skin|skincare|beauty|skin care)$/i,
  hair:/^(?:hair|haircare|hair care)$/i,
  tech:/^(?:tech|technology|gadgets|electronics)$/i
 };
 const isBroad=broadTerms[domain]?.test(lower)??false;
 if(foundNoun){
  const userHasModifier=set.modifiers.some(x=>lower.includes(x.toLowerCase()));
  const userHasMaterial=set.materials.some(x=>lower.includes(x.toLowerCase()));
  if(!userHasModifier)queries.push(...set.modifiers.slice(0,3).map(m=>`${m} ${foundNoun}`));
  if(!userHasMaterial)queries.push(...set.materials.slice(0,3).map(m=>`${m} ${foundNoun}`));
 }else if(isBroad){queries.push(...set.nouns.slice(0,10))}
 return [...new Set(queries.map(q=>q.replace(/\s+/g," ").trim()).filter(q=>q.length>1))].slice(0,18);
}'''
          s=s[:start]+replacement+s[end:]
          oldq='const queries=expandCatalogQueries(query).filter(q=>q.toLowerCase()!==query.toLowerCase()).slice(0,forceDeep?12:4);'
          newq='const queries=expandCatalogQueries(query).filter(q=>q.toLowerCase()!==query.toLowerCase()).slice(0,forceDeep?18:10);'
          if oldq not in s: raise SystemExit('discovery query marker not found')
          s=s.replace(oldq,newq,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "YNOT Search Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/catalog/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "Improve semantic fallback for arbitrary product searches"
          git push origin main
