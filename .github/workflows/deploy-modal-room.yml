name: Deploy Modal room worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ynot-room-poc
    paths:
      - "workers/ynot_room_modal.py"
      - ".github/workflows/deploy-modal-room.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal>=1.2,<2" "fastapi[standard]" pillow requests
      - name: Deploy YNOT Room worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy workers/ynot_room_modal.py --name ynot-room
      - name: Let Modal route traffic to the new deployment
        run: sleep 20
      - name: Reconstruct synthetic room and verify GLB
        env:
          SUBMIT_URL: https://tonykone555--ynot-room-submit-room.modal.run
          STATUS_URL: https://tonykone555--ynot-room-room-status.modal.run
        run: |
          python - <<'PY'
          import io, os, time
          import requests
          from PIL import Image, ImageDraw

          files=[]
          for i in range(3):
              image=Image.new("RGB", (768, 576), (226-i*10, 220-i*4, 211+i*7))
              draw=ImageDraw.Draw(image)
              draw.polygon([(0,340),(768,310),(768,576),(0,576)], fill=(187,176,158))
              draw.line((0,340,768,310), fill=(90,86,80), width=5)
              draw.line((80,0,175+i*20,340), fill=(118,114,108), width=5)
              draw.line((690,0,590-i*18,320), fill=(118,114,108), width=5)
              draw.rectangle((220+i*8,275,555-i*8,430), fill=(100,99,96), outline=(62,62,60), width=6)
              draw.rectangle((285,220,490,305), fill=(121,119,114), outline=(62,62,60), width=5)
              buffer=io.BytesIO()
              image.save(buffer, format="JPEG", quality=90)
              files.append(("photos", (f"view-{i+1}.jpg", buffer.getvalue(), "image/jpeg")))

          response=requests.post(
              os.environ["SUBMIT_URL"],
              files=files,
              data={"style":"modern","roomType":"living_room","budget":"2500","source":"github-deploy-smoke"},
              timeout=60,
          )
          print("submit", response.status_code, response.text)
          response.raise_for_status()
          job=response.json()
          job_id=job["id"]

          terminal=None
          for attempt in range(60):
              time.sleep(5)
              status=requests.get(os.environ["STATUS_URL"], params={"id":job_id}, timeout=30)
              print("status", attempt+1, status.status_code, status.text)
              status.raise_for_status()
              payload=status.json()
              if payload.get("status") in {"ready","failed"}:
                  terminal=payload
                  break

          if terminal is None:
              raise SystemExit("Room reconstruction did not reach a terminal state")
          if terminal.get("status") != "ready":
              raise SystemExit(f"Room reconstruction failed: {terminal}")
          if terminal.get("photoCount") != 3:
              raise SystemExit(f"Unexpected photo count: {terminal}")
          # The multiview worker always exposes this field, even when synthetic views fall back to the seed.
          if "fusedViewCount" not in terminal:
              raise SystemExit(f"Stale Modal worker answered the smoke test: {terminal}")
          scene_url=terminal.get("sceneUrl")
          if not scene_url:
              raise SystemExit(f"Missing sceneUrl: {terminal}")

          scene=requests.get(scene_url, timeout=60)
          print("scene", scene.status_code, scene.headers.get("content-type"), len(scene.content))
          scene.raise_for_status()
          if not scene.content.startswith(b"glTF"):
              raise SystemExit("Returned scene is not a binary glTF/GLB")
          if len(scene.content) < 10_000:
              raise SystemExit("Returned GLB is unexpectedly small")
          print("YNOT Room multiview GLB smoke test passed", terminal)
          PY
