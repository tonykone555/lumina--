name: Deploy Modal room autopilot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ynot-room-poc
    paths:
      - "workers/ynot_room_autopilot_modal.py"
      - ".github/workflows/deploy-modal-room-autopilot.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal>=1.2,<2" "fastapi[standard]" requests
      - name: Deploy YNOT Room autopilot
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy workers/ynot_room_autopilot_modal.py --name ynot-room-autopilot
      - name: Let Modal route traffic to the new deployment
        run: sleep 12
      - name: Verify autopilot release gate
        env:
          AUTOPILOT_URL: https://tonykone555--ynot-room-autopilot-schedule-repair.modal.run
          TEST_ROOM_ID: b8eb5d66-47df-43de-bfe9-9e9c93ae4bb8
        run: |
          python - <<'PY'
          import os, requests
          response=requests.post(os.environ["AUTOPILOT_URL"],params={"id":os.environ["TEST_ROOM_ID"]},timeout=45)
          print("autopilot",response.status_code,response.text[:4000])
          response.raise_for_status()
          data=response.json()
          if data.get("status") not in {"publishable","repair_queued","repair_already_queued","high_detail_in_progress","repair_limit_reached"}:
              raise SystemExit(f"Unexpected autopilot state: {data}")
          if data.get("status")=="publishable" and data.get("scheduled"):
              raise SystemExit(f"Autopilot scheduled work for a publishable room: {data}")
          print("YNOT Room autopilot smoke test passed",data)
          PY
